name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Pushing to a branch with an open PR triggers both events; the
# concurrency group dedupes so we don't burn two runners on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
